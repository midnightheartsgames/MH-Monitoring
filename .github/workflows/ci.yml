# Проверка и релизная сборка (PLAN.md §6/P9).
#
# Правила цепочки поставок:
# * сторонние действия закреплены по SHA коммита, а не по тегу: тег можно перевесить;
# * у токена только чтение, checkout не оставляет его в .git;
# * всё собирается с --locked — ровно те версии, что в Cargo.lock;
# * cargo-deny ставится конкретной версией и тоже с --locked.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Новые уязвимости появляются и без наших коммитов.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: Формат
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Тесты
        run: cargo test --workspace --locked --no-fail-fast

      - name: Чистые крейты собираются и не под Windows
        run: cargo check --workspace --locked --target x86_64-unknown-linux-gnu

  supply-chain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo-deny
        run: cargo install cargo-deny --version $env:CARGO_DENY_VERSION --locked

      - name: Уязвимости, отозванные версии, источники, лицензии
        run: cargo deny --locked check

  release:
    needs: [check, supply-chain]
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Сборка
        run: .\tools\build-release.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MH-Monitoring-${{ github.sha }}
          path: target/dist/
          if-no-files-found: error
