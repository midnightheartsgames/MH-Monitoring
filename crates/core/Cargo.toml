[package]
name = "mh-core"
version.workspace = true
edition.workspace = true
description = "Чистая логика MH Monitoring: статистика кадров, выбор цели, слияние телеметрии"

# Зависимостей нет и не должно появиться без веской причины. Крейт обязан собираться и
# проходить тесты на любой платформе — это и есть проверка, что в нём нет Windows.
#
# Единственное исключение — необязательный `serde`: снимок уходит из службы в UI по каналу
# (PLAN.md §6/P6). Без возможности `serde` крейт по-прежнему без зависимостей.
[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
