[package]
name = "mh-platform"
version.workspace = true
edition.workspace = true
description = "Тонкие обёртки Win32: ETW-сессии, процессы, overlay, хоткеи"

[dependencies]
mh-core = { path = "../core" }

# Только под Windows: на любой другой платформе крейт собирается пустым. Так проверка
# `cargo check --workspace --target x86_64-unknown-linux-gnu` остаётся осмысленной для всего
# рабочего пространства, а не только для двух крейтов из трёх.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }
