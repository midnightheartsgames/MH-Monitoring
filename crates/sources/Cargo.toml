[package]
name = "mh-sources"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Источники данных MH Monitoring: кадры (PresentMon, собственный ETW), железо"

[dependencies]
mh-core = { path = "../core" }
# Только часть `system`: загрузка и частоты CPU, память. Остальные части (диски, сеть, датчики
# через WMI, пользователи) не нужны и тянут лишнее.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# NVML поставляется с драйвером NVIDIA и не требует прав администратора (PLAN.md §2.10).
nvml-wrapper = "0.13"

# Собственный ETW-потребитель живёт только под Windows; на других платформах крейт собирается
# без него, и чистые части (разбор CSV, payload, политика) остаются проверяемыми везде.
[target.'cfg(windows)'.dependencies]
mh-platform = { path = "../platform" }
