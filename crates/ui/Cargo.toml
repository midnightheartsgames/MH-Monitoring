[package]
name = "mh-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MH Monitoring: оверлей, трей, хоткеи"

build = "build.rs"

[[bin]]
name = "MH-Monitoring"
path = "src/main.rs"

[dependencies]
mh-core = { path = "../core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
mh-engine = { path = "../engine" }
mh-platform = { path = "../platform" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
tray-icon = "0.25"
global-hotkey = "0.8"
raw-window-handle = "0.6"
windows-service = "0.8"
mh-ipc = { path = "../ipc" }
mh-sources = { path = "../sources" }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
